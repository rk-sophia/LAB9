name: Python Application CI/CD

# 1. O pipeline é ativado em pushes nas duas branches principais
on:
  push:
    branches:
      - develop
      - main

# 2. Definição de variáveis globais para evitar repetição
env:
  [cite_start]IMAGE_NAME: "sua-api-python" # Altere para o nome da sua imagem [cite: 30, 31]

jobs:
  # JOB 1: Build e Testes (roda para ambas as branches)
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Adicione aqui seus passos de instalação de dependências, testes e build de imagem...

  # JOB 2: Deploy em Homologação (Automático na branch develop)
  deploy_homologacao:
    needs: build
    if: github.ref == 'refs/heads/develop' # Só roda se for push na develop
    runs-on: ubuntu-latest
    steps:
      - name: Deploy em Homologação
        run: |
          echo "Realizando deploy automático em Homologação na porta 8080..."
          # Adicione aqui os comandos para fazer deploy no servidor de homologação [cite: 20]

  # JOB 3: Deploy em Produção (Apenas na main + aprovação manual)
  deploy_producao:
    needs: build
    [cite_start]if: github.ref == 'refs/heads/main' # Garante que produção só ativa na branch main [cite: 34, 35, 36]
    runs-on: ubuntu-latest
    [cite_start]environment: production # Vincula ao ambiente que criamos no Passo 1 (ativa aprovação manual) 
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Executar Deploy em Produção via SSH
        uses: appleboy/ssh-action@master # Action comum para executar comandos via SSH
        with:
          [cite_start]host: ${{ secrets.EC2_HOST }}       # Usa as secrets recomendadas 
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Conectado ao servidor de Produção!"
            # Adicione aqui os comandos para rodar o container/API no ambiente de produção
